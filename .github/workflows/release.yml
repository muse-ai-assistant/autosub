name: Build standalone executables

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux
            data_sep: ':'
          - os: windows-latest
            suffix: win.exe
            data_sep: ';'
          - os: macos-latest
            suffix: macos
            data_sep: ':'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install pyinstaller faster-whisper customtkinter
      - name: Download tiny model (bundled)
        run: python -c "from faster_whisper import WhisperModel; WhisperModel('tiny', device='cpu', download_root='./models')"
      - name: Build CLI
        run: pyinstaller --onefile --name autosub-${{ matrix.suffix }} --add-data "models${{ matrix.data_sep }}models" autosub.py
      - name: Build GUI
        run: pyinstaller --onefile --windowed --name autosub-gui-${{ matrix.suffix }} --add-data "models${{ matrix.data_sep }}models" autosub_gui.py
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
